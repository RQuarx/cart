[colors]
bold_as_bright = true

foreground.bright = 0xFFFFFF
foreground.normal = 0xFFFFFF
foreground.dim = 0xE3C7A1

# foreground = 0xFFFFFF

background.bright = 0x404040
background.normal = 0x000000
background.dim = 0x000000

[colors.palette]
bright = [ 0x404040, 0xFF0000, 0x00FF00, 0xFFFF00, 0x0000FF, 0xFF00FF, 0x00FFFF, 0xFFFFFF ]
normal = [ 0x000000, 0xCD0000, 0x00CD00, 0xCDCD00, 0x0000CD, 0xCD00CD, 0x00CDCD, 0xFAEBD7 ]

# If dim is not defined,
# the terminal will attempt to use a "darkened" version of the `normal` colours.
dim = [ 0x000000, 0x872B22, 0x549E4E, 0xAAAB34, 0x0F2353, 0x972596, 0x31A7A6, 0xE3C7A1 ]

[window]
padding = { x = 0, y = 0 }

# Spread additional padding evenly around the terminal content
dynamic_padding = false

title = "cart"

[scrolling]
scrollback = 100000
multiplier = 3 # Amount of lines scrolled during a single scroll input

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

# If the family isn't specified, it will use the normal's family value
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

size = 12.0 # Font size in points

[cursor]
# Available shapes: beam, underline, block
shape = "beam"

# Modes: never, off, on, always
blinking = "on"

blink_interval = 750

# The time it takes for the cursor to stop blicking (in seconds)
# Any number <= 0 will disable blink timeout
blink_timeout = 5

unfocused_hollow = true
thickness = 0.15 # thickness of the cursor relative to the cell width (0.0 - 1.0)

[terminal]
rows = 120 # Default rows and columns on spawn
columns = 80

