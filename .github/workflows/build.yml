name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libspdlog-dev         \
            libsdl3-dev           \
            libsdl3-ttf-dev

      - name: Install Meson
        run: python3 -m pip install --user meson ninja

      - name: Configure
        run: meson setup build

      - name: Compile
        run: meson compile -C build
